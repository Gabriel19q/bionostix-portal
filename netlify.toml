# Netlify hosting (pilot). Netlify detects Next.js and installs its runtime automatically.
# Environment variables are set in the Netlify UI (Project configuration → Environment variables), never here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These values are public (shown in the browser or in every email), so the secrets scan may ignore them.
  # Real secrets such as RESEND_API_KEY stay covered by the scan.
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_FROM,ADMIN_NOTIFY_EMAILS,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_CONTACT_EMAIL"
